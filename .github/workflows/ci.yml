name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    name: Build & Test (ubuntu-latest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------------------
      # 1. Install HDF5 (C library + headers) – required by trexio C
      # ------------------------------------------------------------------
      - name: Install HDF5
        run: |
          sudo apt-get update
          sudo apt-get install -y libhdf5-dev

      # ------------------------------------------------------------------
      # 2. Download, build and install the trexio C library
      # ------------------------------------------------------------------
      - name: Compute TREXIO C library tag from Cargo.toml
        id: version
        run: |
          CRS_VER=$(grep '^version' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          MAJOR=$(echo "$CRS_VER" | cut -d. -f1)
          MINOR=$(echo "$CRS_VER" | cut -d. -f2)
          PATCH=$(echo "$CRS_VER" | cut -d. -f3)
          # Rust version 2.6.1xx targets C library 2.6.x (first digit of patch)
          C_PATCH=$((PATCH / 100))
          echo "TREXIO_TAG=${MAJOR}.${MINOR}.${C_PATCH}" >> "$GITHUB_OUTPUT"

      - name: Download, build and install the trexio C library
        run: |
          echo "VERSION=${{ steps.version.outputs.TREXIO_TAG }}"
          curl -L -o trexio.tar.gz \
            "https://github.com/TREX-CoE/trexio/releases/download/v${{ steps.version.outputs.TREXIO_TAG }}/trexio-${{ steps.version.outputs.TREXIO_TAG }}.tar.gz"

          tar xzf trexio.tar.gz
          cd trexio-${{ steps.version.outputs.TREXIO_TAG }}

          mkdir build && cd build
          cmake .. \
            -DCMAKE_INSTALL_PREFIX=/usr/ \
            -DTREXIO_USE_HDF5=ON \
            -DTREXIO_FORTRAN=OFF \
            -DTREXIO_PYTHON=OFF \
            -DBUILD_TESTING=OFF \
            -DCMAKE_BUILD_TYPE=Release

          make -j$(nproc)
          sudo make install

      # ------------------------------------------------------------------
      # 3. Tell ldconfig where libtrexio.so lives, then build / test Rust
      # ------------------------------------------------------------------
      - name: Build and test with Cargo
        run: |
          sudo ldconfig
          cargo build --verbose
          cargo test --verbose
